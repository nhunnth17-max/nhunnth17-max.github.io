<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail CRM</title>
<style>
:root{color-scheme:dark}
[hidden]{display:none!important}
body{font:15px system-ui,sans-serif;margin:0;background:#110d24;color:#eceaf8}
main{max-width:1100px;margin:auto;padding:16px 16px 90px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select,button,textarea{font:inherit;padding:10px;border:1px solid #37304f;border-radius:10px;background:#1d1832;color:inherit;max-width:100%}
button{cursor:pointer}button.main{background:linear-gradient(135deg,#6c5ce7,#4834d4);border:0;color:#fff}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.head h2{margin:0}
#q{width:100%;box-sizing:border-box;margin:12px 0}
.cards{display:flex;gap:12px;overflow-x:auto;margin-bottom:12px}
.stat{flex:0 0 150px;text-align:left;background:linear-gradient(135deg,#0f3445,#141c36)}
.stat b{display:block;font-size:30px;color:#4fe3c1}.stat small{text-transform:uppercase;color:#a9a4c4}
.stat:nth-child(4n){background:linear-gradient(135deg,#4a3a36,#221c30)}.stat:nth-child(5n){background:linear-gradient(135deg,#47163f,#22112c)}
.stat.on{border:2px solid #a29bfe}
.scroll{overflow-x:auto;border:1px solid #37304f;border-radius:12px}table{width:100%;border-collapse:collapse;background:#1b1630}
td,th{padding:12px;border-bottom:1px solid #2c2645;text-align:left;white-space:nowrap}
th{background:#2a1f5c;text-transform:uppercase;font-size:13px;border-bottom:2px solid #6c5ce7}
td button{background:none;border:0;padding:0;text-align:left}.code{font-family:monospace;color:#8d87a8}
.ava{display:inline-block;width:30px;line-height:30px;border-radius:50%;background:#e8836a;text-align:center;font-size:11px;font-weight:700;margin-right:8px}
.card{background:#1b1630;padding:12px;border-radius:12px;margin-bottom:12px}
.dnc{color:#ff8a80;font-weight:600}dialog{border:1px solid #37304f;border-radius:14px;width:min(560px,88vw);background:#171229;color:inherit}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;overflow-x:auto;background:#1b1442;border-top:1px solid #37304f;z-index:1}
nav button{flex:1 0 82px;border:0;border-radius:0;background:none;color:#a9a4c4;font-size:13px;padding:14px 6px;border-top:3px solid transparent}
nav button.on{color:#fff;background:#2e2470;border-top-color:#00cec9}
</style>
</head>
<body>
<main>
<form id="login" class="card row" hidden>
  <input name="email" type="email" placeholder="Email" required>
  <input name="password" type="password" placeholder="Mật khẩu" required>
  <button class="main">Đăng nhập</button>
</form>
<div id="app" hidden>
  <nav>
    <button data-tab="salons">Khách hàng</button><button data-tab="campaign">Campaign</button>
    <button data-tab="potential">Tiềm năng</button><button data-tab="order">Order</button>
    <button data-tab="pipe">Pipeline</button><button data-tab="follow">Cảnh báo</button>
    <button data-tab="report">Dashboard</button><button data-tab="dnc">Không gọi</button><button id="out">Thoát</button>
  </nav>
  <div id="view"></div>
</div>
<dialog id="dlg"></dialog>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// === ĐIỀN 2 GIÁ TRỊ NÀY (Supabase > Project Settings > API) ===
const URL_ = 'https://wkzkprrqdlhhfedqstff.supabase.co';
const KEY = 'sb_publishable_-9x9NZr-yBlZrhn0NufGPg_ErFrsryI';   // chỉ dùng anon key, KHÔNG dùng service_role

const db = supabase.createClient(URL_, KEY);
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STAGE = {new:'Mới',called:'Đã gọi',interested:'Quan tâm',ordered:'Đặt hàng'};
const ZONES = ['America/New_York','America/Chicago','America/Denver','America/Phoenix','America/Los_Angeles','America/Anchorage','Pacific/Honolulu'];
const POT = ['Hot','Warm','Cold'];
const PRODUCTS = ['Pedicure Spa & Package','Furniture','Padset','Headspa Bed'];
const FIELDS = [['stage','Status'],['potential','Potential'],['lead_source','Lead'],['brand','Brand'],['reason','Reason']];
const filter = {};
const overdue = s => s.follow_up && new Date(s.follow_up) < new Date() && !s.do_not_call;
const monthOf = s => s.created_at.slice(0,7);
const values = k => [...new Set(S.map(s => s[k]).filter(Boolean))].sort();
const initials = id => esc((M.find(m => m.user_id === id)?.name || '?').slice(0,2).toUpperCase());
let me, tab = 'salons', q = '', S = [], C = [], O = [], M = [];

const time = (d, tz) => new Date(d).toLocaleString('vi-VN', {timeZone: tz, dateStyle:'short', timeStyle:'short'});
const money = n => '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2});
const phone = p => p.replace(/\D/g,'').replace(/^1(?=\d{10}$)/,'');
const opts = (list, sel) => list.map(([v,t]) => `<option value="${v}" ${v===sel?'selected':''}>${t}</option>`).join('');

async function run(query) {
  const {data, error} = await query;
  if (error) { alert(error.message); throw error; }
  return data;
}
async function all(table, key = 'id') {   // Supabase trả tối đa 1000 dòng mỗi lần
  let rows = [], from = 0, part;
  do {
    part = await run(db.from(table).select('*').order(key).range(from, from + 999));
    rows = rows.concat(part); from += 1000;
  } while (part.length === 1000);
  return rows;
}
async function load() {
  [S, C, O, M] = await Promise.all([all('salons'), all('calls'), all('orders'), all('members','user_id')]);
  me = M.find(m => m.user_id === me.user_id);
  render();
}
async function start() {
  const {data:{session}} = await db.auth.getSession();
  $('#login').hidden = !!session; $('#app').hidden = !session;
  if (!session) return;
  const m = await run(db.from('members').select('*').eq('user_id', session.user.id).maybeSingle());
  if (!m) { alert('Tài khoản chưa được thêm vào team.'); await db.auth.signOut(); return location.reload(); }
  me = m; await load();
}

function table(rows) {
  return `<div class="scroll"><table><tr><th>Mã KH</th><th>Business name</th><th>Customer</th><th>SĐT</th><th>Bang</th><th>Potential</th><th>Status</th><th>Giờ ở tiệm</th><th>Lead</th><th>Brand</th><th>Gọi lại (giờ tiệm)</th></tr>${
  rows.map(s => `<tr><td class="code">${esc(s.code)}</td><td><button data-id="${s.id}">${esc(s.name)}</button></td>
  <td><span class="ava">${initials(s.assigned_to)}</span>${esc(s.owner)}</td><td>${esc(s.phone)}</td><td>${esc(s.state)}</td>
  <td>${esc(s.potential)}</td><td class="${s.do_not_call?'dnc':''}">${s.do_not_call?'KHÔNG GỌI':STAGE[s.stage]}</td>
  <td>${time(Date.now(), s.timezone)}</td><td>${esc(s.lead_source)}</td><td>${esc(s.brand)}</td>
  <td class="${overdue(s)?'dnc':''}">${s.follow_up ? time(s.follow_up, s.timezone) : ''}</td></tr>`).join('') || '<tr><td colspan="11">Chưa có dữ liệu</td></tr>'}</table></div>`;
}
function list() {
  const k = q.toLowerCase();
  const rows = S.filter(s => [s.code,s.name,s.owner,s.phone,s.state].join(' ').toLowerCase().includes(k)
    && FIELDS.every(([f]) => !filter[f] || s[f] === filter[f])
    && (!filter.late || overdue(s)) && (!filter.month || monthOf(s) === filter.month));
  $('#list').innerHTML = `<h3>Danh sách ${rows.length} khách</h3>${table(rows)}`;
}
function render() {
  const v = $('#view'), active = S.filter(s => !s.do_not_call);
  document.querySelectorAll('nav [data-tab]').forEach(x => x.classList.toggle('on', x.dataset.tab === tab));
  if (tab === 'salons') {
    const card = (label, n, stage) => `<button class="stat ${stage !== null && (filter.stage || '') === stage ? 'on' : ''}" ${stage === null ? '' : `data-stage="${stage}"`}><small>${esc(label)}</small><b>${n}</b></button>`;
    const sel = (f, label, list) => `<select data-f="${f}">${opts([['',`Tất cả ${label}`], ...list], filter[f] || '')}</select>`;
    v.innerHTML = `<div class="head"><h2>Khách hàng</h2><button class="main" id="add">+ Thêm khách</button></div>
      <input id="q" placeholder="Tìm tên, SĐT, mã KH, bang..." value="${esc(q)}">
      <div class="cards">${card('Tổng data', S.length, '')}${card('Closedeal', S.filter(s => s.stage === 'ordered').length, 'ordered')}
        ${card('Được giao cho tôi', S.filter(s => s.assigned_to === me.user_id).length, null)}
        ${[...new Set([...PRODUCTS, ...values('brand')])].map(b => card(b, S.filter(s => s.brand === b).length, null)).join('')}</div>
      <div class="row">${FIELDS.map(([f,label]) => sel(f, label, f === 'stage' ? Object.entries(STAGE) : values(f).map(x => [esc(x),esc(x)]))).join('')}
        ${sel('late', 'hạn gọi', [['1','Chỉ quá hạn']])}${sel('month', 'tháng', [...new Set(S.map(monthOf))].sort().map(x => [x,x]))}</div>
      <div id="list"></div>`;
    list();
    $('#q').oninput = e => { q = e.target.value; list(); };
    $('#add').onclick = () => edit();
    v.querySelectorAll('[data-f]').forEach(x => x.onchange = () => { filter[x.dataset.f] = x.value; render(); });
    v.querySelectorAll('[data-stage]').forEach(x => x.onclick = () => { filter.stage = x.dataset.stage; render(); });
  } else if (tab === 'campaign') {
    v.innerHTML = values('campaign').map(c => { const r = S.filter(s => s.campaign === c); return `<h3>${esc(c)} (${r.length})</h3>${table(r)}`; }).join('')
      || '<p>Chưa có campaign. Mở một khách và điền ô Campaign.</p>';
  } else if (tab === 'potential') {
    v.innerHTML = POT.map(p => { const r = active.filter(s => s.potential === p); return `<h3>${p} (${r.length})</h3>${table(r)}`; }).join('');
  } else if (tab === 'order') {
    v.innerHTML = `<h2>Order</h2><div class="scroll"><table><tr><th>Ngày</th><th>Tiệm</th><th>Số tiền</th><th>Sản phẩm</th><th>Nhân viên</th></tr>${[...O].reverse().map(o => {
      const x = S.find(s => s.id === o.salon_id);
      return `<tr><td>${time(o.created_at)}</td><td><button data-id="${o.salon_id}">${esc(x?.name)}</button></td><td>${money(o.amount)}</td><td>${esc(o.note)}</td><td>${esc(M.find(m => m.user_id === o.user_id)?.name)}</td></tr>`;
    }).join('') || '<tr><td colspan="5">Chưa có đơn</td></tr>'}</table></div>`;
  } else if (tab === 'follow') {
    v.innerHTML = table(active.filter(s => s.follow_up).sort((a,b) => new Date(a.follow_up) - new Date(b.follow_up)));
  } else if (tab === 'pipe') {
    v.innerHTML = Object.entries(STAGE).map(([k,t]) => { const r = active.filter(s => s.stage === k); return `<h3>${t} (${r.length})</h3>${table(r)}`; }).join('');
  } else if (tab === 'dnc') {
    v.innerHTML = table(S.filter(s => s.do_not_call));
  } else {
    const month = new Date().toISOString().slice(0,7);
    v.innerHTML = `<h3>Tháng ${month} (theo giờ UTC)</h3><div class="scroll"><table><tr><th>Nhân viên</th><th>Cuộc gọi</th><th>Đơn</th><th>Doanh số</th></tr>${M.map(m => {
      const mine = x => x.user_id === m.user_id && x.created_at.startsWith(month), o = O.filter(mine);
      return `<tr><td>${esc(m.name)}</td><td>${C.filter(mine).length}</td><td>${o.length}</td><td>${money(o.reduce((a,x) => a + Number(x.amount), 0))}</td></tr>`;
    }).join('')}</table></div>`;
  }
}

function edit(s = {}) {
  const d = $('#dlg'), who = id => esc(M.find(m => m.user_id === id)?.name);
  const history = [
    ...C.filter(c => c.salon_id === s.id).map(c => [c.created_at, `${who(c.user_id)}: ${esc(c.result)} ${esc(c.note)}`]),
    ...O.filter(o => o.salon_id === s.id).map(o => [o.created_at, `${who(o.user_id)}: đơn ${money(o.amount)} ${esc(o.note)}`])
  ].sort((a,b) => b[0].localeCompare(a[0]));
  d.innerHTML = `<form id="f" class="row">
    <input name="name" placeholder="Tên tiệm" required value="${esc(s.name)}">
    <input name="owner" placeholder="Chủ tiệm" value="${esc(s.owner)}">
    <input name="phone" placeholder="SĐT" required value="${esc(s.phone)}">
    <input name="state" placeholder="Bang (TX, CA...)" maxlength="2" value="${esc(s.state)}">
    <select name="timezone">${opts(ZONES.map(z => [z,z]), s.timezone || 'America/Chicago')}</select>
    <select name="stage">${opts(Object.entries(STAGE), s.stage || 'new')}</select>
    <select name="potential">${opts([['','Potential'], ...POT.map(x => [x,x])], s.potential || '')}</select>
    ${[['lead_source','Lead (nguồn)'],['brand','Brand / sản phẩm'],['reason','Reason (lý do)'],['campaign','Campaign']].map(([f,p]) => `<input name="${f}" placeholder="${p}" value="${esc(s[f])}" ${f==='brand'?'list="products"':''}>`).join('')}
    <datalist id="products">${PRODUCTS.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
    <select name="assigned_to">${opts(M.map(m => [m.user_id, 'Giao cho ' + esc(m.name)]), s.assigned_to || me.user_id)}</select>
    <label>Gọi lại (giờ máy bạn) <input name="follow_up" type="datetime-local"></label>
    <label><input name="do_not_call" type="checkbox" ${s.do_not_call?'checked':''}> Không gọi</label>
    <button class="main">Lưu</button><button type="button" id="close">Đóng</button></form>
  ${s.id ? `${s.do_not_call ? '<p class="dnc">Tiệm yêu cầu không gọi.</p>' : `<form id="call" class="row">
    <select name="result">${opts(['Không bắt máy','Đã nói chuyện','Hẹn gọi lại','Quan tâm','Từ chối'].map(x => [x,x]))}</select>
    <input name="note" placeholder="Ghi chú"><button>Ghi cuộc gọi</button></form>`}
    <form id="order" class="row"><input name="amount" type="number" step="0.01" min="0.01" placeholder="Số tiền $" required>
    <input name="note" placeholder="Sản phẩm"><button>Thêm đơn</button></form>
    <ul>${history.map(h => `<li>${time(h[0])} - ${h[1]}</li>`).join('')}</ul>` : ''}`;

  const input = d.querySelector('[name=follow_up]');
  if (s.follow_up) { const t = new Date(s.follow_up); input.value = new Date(t - t.getTimezoneOffset()*60000).toISOString().slice(0,16); }
  const on = (id, fn) => { const f = d.querySelector(id); if (f) f.onsubmit = async e => {
    e.preventDefault();
    const btn = e.submitter; btn.disabled = true;
    try { await fn(Object.fromEntries(new FormData(f))); d.close(); await load(); }
    finally { btn.disabled = false; }
  }; };
  on('#f', v => {
    for (const f of ['potential','lead_source','brand','reason','campaign']) v[f] = v[f].trim() || null;
    const row = {...v, phone: phone(v.phone), state: v.state.toUpperCase(), do_not_call: !!v.do_not_call,
      follow_up: v.follow_up ? new Date(v.follow_up).toISOString() : null};
    return run(s.id ? db.from('salons').update(row).eq('id', s.id) : db.from('salons').insert(row));
  });
  on('#call', async v => {
    await run(db.from('calls').insert({...v, salon_id: s.id}));
    if (s.stage === 'new') await run(db.from('salons').update({stage:'called'}).eq('id', s.id));
  });
  on('#order', async v => {
    await run(db.from('orders').insert({...v, salon_id: s.id}));
    await run(db.from('salons').update({stage:'ordered'}).eq('id', s.id));
  });
  d.querySelector('#close').onclick = () => d.close();
  d.showModal();
}

$('#login').onsubmit = async e => {
  e.preventDefault();
  const {error} = await db.auth.signInWithPassword(Object.fromEntries(new FormData(e.target)));
  if (error) return alert(error.message);
  start();
};
$('#out').onclick = async () => { await db.auth.signOut(); location.reload(); };
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; load(); }
  if (b.dataset.id) edit(S.find(s => s.id == b.dataset.id));
});
start();
</script>
</body>
</html>
