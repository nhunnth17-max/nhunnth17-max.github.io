<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light}
[hidden]{display:none!important}
body{font:15px "Be Vietnam Pro",system-ui,sans-serif;margin:0;background:#f4f5f7;color:#081c36}
main{max-width:1100px;margin:auto;padding:16px 16px 90px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select,button,textarea{font:inherit;padding:10px;border:1px solid #d6dbe1;border-radius:10px;background:#fff;color:inherit;max-width:100%}
button{cursor:pointer}button.main{background:linear-gradient(135deg,#0068ff,#0057d6);border:0;color:#fff;font-weight:600}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.head h2{margin:0}
#q{width:100%;box-sizing:border-box;margin:12px 0}
.cards{display:flex;gap:12px;overflow-x:auto;margin-bottom:12px}
.stat{flex:0 0 150px;text-align:left;background:linear-gradient(135deg,#fff,#e5efff)}
.stat b{display:block;font-size:30px;color:#0068ff}.stat small{text-transform:uppercase;color:#5a6b81}
.stat:nth-child(4n){background:linear-gradient(135deg,#fff,#dcebff)}.stat:nth-child(5n){background:linear-gradient(135deg,#fff,#eef4ff)}
nav i{display:block;font-style:normal;font-size:18px}#out{color:#d93025}#menu{max-height:85vh}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid button{padding:14px 4px;font-size:13px;background:#f0f6ff}.grid button:disabled{opacity:.35}
.stat.on{border:2px solid #0068ff}
.scroll{overflow-x:auto;border:1px solid #d6dbe1;border-radius:12px}table{width:100%;border-collapse:collapse;background:#fff}
td,th{padding:12px;border-bottom:1px solid #e8ebef;text-align:left;white-space:nowrap}
th{background:#e5efff;text-transform:uppercase;font-size:13px;border-bottom:2px solid #0068ff}
td button{background:none;border:0;padding:0;text-align:left}.code{font-family:monospace;color:#6b7a90}
.ava{display:inline-block;width:30px;line-height:30px;border-radius:50%;background:#0068ff;text-align:center;color:#fff;font-size:11px;font-weight:700;margin-right:8px}
.card{background:#fff;padding:12px;border-radius:12px;margin-bottom:12px}
.dnc{color:#b42318;font-weight:600}dialog{border:1px solid #d6dbe1;border-radius:14px;width:min(560px,88vw);background:#fff;color:inherit}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;overflow-x:auto;background:#fff;border-top:1px solid #d6dbe1;z-index:1}
nav button{flex:1 0 82px;border:0;border-radius:0;background:none;color:#5a6b81;font-size:13px;padding:14px 6px;border-top:3px solid transparent}
nav button.on{color:#0068ff;background:#e5efff;border-top-color:#0068ff}

#dlg{width:min(640px,100vw);height:100dvh;max-height:100dvh;padding:0;border:0;border-radius:0;background:#1a1440;color:#e9e6ff}
#dlg[open]{display:flex;flex-direction:column}
#dlg input,#dlg select,#dlg textarea{width:100%;box-sizing:border-box;background:#2a2250;border:1px solid #3d3470;color:#e9e6ff}
#dlg option{background:#2a2250}#dlg textarea{resize:vertical}
#dlg input[type=checkbox]{width:auto;margin-right:8px}
.dh{display:flex;gap:12px;align-items:center;padding:16px;border-bottom:1px solid #2f2860}.dt{flex:1}.dt b{font-size:22px}
.dt small{display:block;color:#9a94c4;margin-top:4px}
.clk{margin-left:8px;border:1px solid #8a6d2f;color:#f5c451;background:#3a2f1f;border-radius:99px;padding:3px 12px;font:14px monospace;white-space:nowrap}
.ava.big{width:52px;line-height:52px;font-size:18px;margin:0;background:linear-gradient(135deg,#f08a6c,#e66f9a)}
.db{flex:1;overflow:auto;padding:8px 16px 16px}.g{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}
.fl{display:block}.fl span{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#9a94c4;margin:14px 0 6px}
.tel{display:flex;align-items:center;gap:8px;min-height:50px}
#dlg .tel input[readonly]{background:none;border:0;padding:0;width:11ch;font:17px monospace}
.ic{width:42px;height:42px;border-radius:50%;padding:0;display:inline-grid;place-items:center;background:#2a2250;border:0;color:#a99dff;text-decoration:none}
.ic.call{background:#12353a;color:#2dd4a7}.sq{border-radius:10px;padding:0 14px;height:42px;background:none;border:1px solid #3d3470;color:inherit}
.df{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;padding:12px 16px;border-top:1px solid #2f2860}
.df button{background:#231b52;border:1px solid #3d3470;color:#e9e6ff;padding:12px 16px}.df button:disabled{opacity:.4}.df span{color:#9a94c4}
.df .main{background:linear-gradient(135deg,#6b5cff,#5846e8);border:0}#help{border-color:#6b5cff!important;color:#a99dff!important}#inv{border-color:#8a6d2f!important;color:#f5c451!important}
#dlg li{margin:6px 0;color:#c9c4ee}

:root{color-scheme:dark}body{background:#0f0b26;color:#e9e6ff}
input,select,textarea,button{background:#1c1640;border-color:#2f2860;color:#e9e6ff}
#add{background:#1f1a45;border:0;box-shadow:0 0 18px #4b3fd966}#q{border-radius:99px;padding:14px 18px}
.card{background:#161036}.head h2,h2,h3,h4{color:#e9e6ff}
.scroll{border-color:#2f2860}table{background:#120d2e}td,th{border-bottom-color:#241d4d}
th{background:#2a2063;color:#e9e6ff;border-bottom:2px solid #6b5cff}td button{color:#e9e6ff}.code{color:#8d86b8}
nav{background:#1b1550;border-top-color:#2f2860}nav button{color:#9a94c4;background:none}nav button.on{background:#2a2063;color:#fff;border-top-color:#6b5cff}
#menu{background:#1a1440;color:#e9e6ff;border-color:#2f2860}.grid button{background:#231b52}
.stat{flex:0 0 170px;color:#e9e6ff;border:1px solid #2f2860;border-radius:18px;padding:16px;min-height:120px}
.stat:nth-child(n){background:#102f3d}.stat:nth-child(4){background:#33262c}.stat:nth-child(5){background:#35153f}.stat:nth-child(6){background:#35182b}
.stat:first-child{background:linear-gradient(135deg,#2a2063,#1c1640)}.stat:first-child b{color:#b6a9ff}
.stat small{color:#9a94c4}.stat b{color:#2dd4bf}.stat em{display:block;font-style:normal;color:#8d86b8;margin-top:8px}.stat.on{border:2px solid #9d8cff}
.bd{display:inline-block;border:1px solid;border-radius:99px;padding:5px 14px;font-weight:600;font-size:14px}
.bd.gold{color:#f5c451;border-color:#8a6d2f;background:#33281a}.bd.green{color:#34d399;border-color:#1f6b57;background:#103a33}.bd.red{color:#ff6b6b;border-color:#8a3535;background:#3a1a22}
.teal{color:#2dd4bf}.gold{color:#f5c451;font-weight:600}.ph{line-height:1.5}.ava{background:linear-gradient(135deg,#f08a6c,#e66f9a)}
.bd.blue{color:#8ea2ff;border-color:#3d4a9a;background:#1c2354}</style>
</head>
<body>
<main>
<form id="login" class="card row" hidden>
  <input name="email" type="email" placeholder="Email" required>
  <input name="password" type="password" placeholder="Mật khẩu" required>
  <button class="main">Đăng nhập</button>
</form>
<div id="app" hidden>
  <nav><button id="apps"><i>▦</i>Apps</button><button data-tab="salons"><i>👥</i>Khách hàng</button><button data-tab="campaign"><i>📣</i>Campaign</button><button data-tab="potential"><i>⭐</i>Tiềm năng</button><button data-tab="order"><i>🏆</i>Order</button><button data-tab="pipe"><i>🗂️</i>Pipeline</button><button data-tab="approve"><i>🕒</i>Chờ duyệt</button><button data-tab="report"><i>📊</i>Dashboard</button><button data-tab="follow"><i>🔔</i>Cảnh báo</button><button data-tab="product"><i>📦</i>Sản phẩm</button><button data-tab="daily"><i>📅</i>Daily</button><button data-tab="contest"><i>🎲</i>Contest</button><button data-tab="help"><i>📖</i>Hướng dẫn</button><button data-tab="notice"><i>📢</i>Thông báo</button><button data-tab="system"><i>⚙️</i>System</button><button data-tab="chat"><i>💬</i>Chat</button><button data-tab="dnc"><i>🚫</i>Không gọi</button><button id="switch"><i>🔁</i>Chuyển tài khoản</button><button id="out"><i>🚪</i>Đăng xuất</button></nav>
  <div id="view"></div>
</div>
<dialog id="dlg"></dialog>
<dialog id="menu"><h3>Nail CRM</h3><div class="grid"><button data-tab="salons">👥<br>Khách hàng</button><button data-tab="campaign">📣<br>Campaign</button><button data-tab="potential">⭐<br>Tiềm năng</button><button data-tab="order">🏆<br>Order</button><button data-tab="pipe">🗂️<br>Pipeline</button><button data-tab="approve">🕒<br>Chờ duyệt</button><button data-tab="report">📊<br>Dashboard</button><button data-tab="follow">🔔<br>Cảnh báo</button><button data-tab="product">📦<br>Sản phẩm</button><button data-tab="daily">📅<br>Daily</button><button data-tab="contest">🎲<br>Contest</button><button data-tab="help">📖<br>Hướng dẫn</button><button data-tab="notice">📢<br>Thông báo</button><button data-tab="system">⚙️<br>System</button><button data-tab="chat">💬<br>Chat</button><button data-tab="dnc">🚫<br>Không gọi</button></div></dialog>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// === ĐIỀN 2 GIÁ TRỊ NÀY (Supabase > Project Settings > API) ===
const URL_ = 'https://wkzkprrqdlhhfedqstff.supabase.co';
const KEY = 'sb_publishable_-9x9NZr-yBlZrhn0NufGPg_ErFrsryI';   // chỉ dùng anon key, KHÔNG dùng service_role

const db = supabase.createClient(URL_, KEY);
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STAGE = {new:'New',called:'Follow',ordered:'Completed'};
const LEADS = ['Closedeal','Lost','Invalid Lead','No Response','Busy'], LEAD = {Closedeal:'green', Lost:'red', 'Invalid Lead':'red', 'No Response':'gold', Busy:'blue'};
const ZONES = ['America/New_York','America/Chicago','America/Denver','America/Phoenix','America/Los_Angeles','America/Anchorage','Pacific/Honolulu'];
const PRODUCTS = ['Pedicure Spa & Package','Furniture','Padset','Headspa Bed','Nail Supply','Acc & Part'];
const POT = PRODUCTS;
const FIELDS = [['stage','Status'],['potential','Potential'],['lead_status','Lead'],['lead_source','Nguồn'],['reason','Reason']];
const REASONS = [
  'R1 - Khách chưa có nhu cầu',
  'R2 - Khách bận',
  'R3 - Franchise không cho mua ngoài',
  'R4 - Đổi nhu cầu',
  'R5 - Có nhu cầu nhưng rất xa',
  'R6 - Chỉ tham khảo',
  'R7 - Không muốn tiếp tục',
  'R8 - Giá chưa phù hợp',
  'R9 - Đang so sánh',
  'R10 - Ngại mua hàng xa',
  'R11 - Lo ngại lắp đặt',
  'R12 - Mới thay nội thất',
  'R13 - Chủ đã bán tiệm',
  'R14 - Đang build tiệm/Remodel tiệm',
  'R15 - Chỉ dùng thương hiệu khác',
  'R16 - Sai số',
  'R17 - Không gặp người quyết định',
  'R18 - Chưa có ngân sách',
  'R19 - Đang làm với vendor khác',
  'R20 - Khó giao tiếp'
];
const filter = {};
const overdue = s => s.follow_up && new Date(s.follow_up) < new Date() && !s.do_not_call;
const monthOf = s => s.created_at.slice(0,7);
const values = k => [...new Set(S.map(s => s[k]).filter(Boolean))].sort();
const initials = id => esc((M.find(m => m.user_id === id)?.name || '?').slice(0,2).toUpperCase());
let me, tab = 'salons', q = '', S = [], C = [], O = [], M = [];

const time = (d, tz) => new Date(d).toLocaleString('vi-VN', {timeZone: tz, dateStyle:'short', timeStyle:'short'});
const money = n => '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2});
const phone = p => p.replace(/\D/g,'').replace(/^1(?=\d{10}$)/,'');
const opts = (list, sel) => list.map(([v,t]) => `<option value="${v}" ${v===sel?'selected':''}>${t}</option>`).join('');

async function run(query) {
  const {data, error} = await query;
  if (error) { alert(error.message); throw error; }
  return data;
}
async function all(table, key = 'id') {   // Supabase trả tối đa 1000 dòng mỗi lần
  let rows = [], from = 0, part;
  do {
    part = await run(db.from(table).select('*').order(key).range(from, from + 999));
    rows = rows.concat(part); from += 1000;
  } while (part.length === 1000);
  return rows;
}
async function load() {
  [S, C, O, M] = await Promise.all([all('salons'), all('calls'), all('orders'), all('members','user_id')]);
  S.forEach(s => { if (s.stage === 'interested') s.stage = 'called'; });
  me = M.find(m => m.user_id === me.user_id);
  render();
}
async function start() {
  const {data:{session}} = await db.auth.getSession();
  $('#login').hidden = !!session; $('#app').hidden = !session;
  if (!session) return;
  const m = await run(db.from('members').select('*').eq('user_id', session.user.id).maybeSingle());
  if (!m) { alert('Tài khoản chưa được thêm vào team.'); await db.auth.signOut(); return location.reload(); }
  me = m; await load();
}

const days = d => Math.floor((Date.now() - new Date(d)) / 864e5);
const badge = (t, c) => `<span class="bd ${c}">${esc(t)}</span>`;
function table(rows) {
  const head = ['Mã KH','Business name','Customer','Phone','State','Potential','Status','Lead status','Deadline','Ngày thêm','Sale'];
  return `<div class="scroll"><table><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map(s => {
    const f = s.follow_up && (new Date(s.follow_up) - Date.now()) / 864e5, a = days(s.created_at);
    const st = s.do_not_call ? badge('Không gọi','red') : badge(STAGE[s.stage] || 'New', {ordered:'green', called:'gold'}[s.stage] || 'blue');
    return `<tr><td class="code">${esc(s.code)}</td><td><button data-id="${s.id}">${esc(s.name)}</button></td>
    <td><span class="ava">${initials(s.assigned_to)}</span>${esc(s.owner)}</td>
    <td class="code ph">${esc(s.cellphone || s.phone)}${s.cellphone && s.cellphone !== s.phone ? `<br>${esc(s.phone)}` : ''}</td>
    <td>${esc(ST[(s.state || '').toUpperCase()]?.[0] || s.state)}</td><td class="teal">${esc(s.potential)}</td><td>${st}</td>
    <td>${s.lead_status ? `<span title="${esc(s.reason)}">${badge(s.lead_status, LEAD[s.lead_status] || 'gold')}</span>` : '—'}</td>
    <td>${s.follow_up && !s.do_not_call ? (f < 0 ? badge(`Hết hạn ${Math.ceil(-f)}d`,'red') : badge(`Còn ${Math.floor(f)}d`,'gold')) : '—'}</td>
    <td class="gold">${a}d${a >= 7 && s.stage !== 'ordered' ? ' ⚠️' : ''}</td>
    <td>${esc(M.find(m => m.user_id === s.assigned_to)?.name)}<br><small class="code">${esc(s.campaign)}</small></td></tr>`;
  }).join('') || '<tr><td colspan="11">Chưa có dữ liệu</td></tr>'}</table></div>`;
}
function list() {
  const k = q.toLowerCase();
  const rows = S.filter(s => [s.code,s.name,s.owner,s.owner2,s.phone,s.cellphone,s.state].join(' ').toLowerCase().includes(k)
    && FIELDS.every(([f]) => !filter[f] || (filter[f] === '_none' ? !s[f] : s[f] === filter[f]))
    && (!filter.late || overdue(s)) && (!filter.month || monthOf(s) === filter.month));
  $('#list').innerHTML = `<h3>Danh sách ${rows.length} khách</h3>${table(rows)}`;
}
function render() {
  const v = $('#view'), active = S.filter(s => !s.do_not_call);
  document.querySelectorAll('nav [data-tab]').forEach(x => x.classList.toggle('on', x.dataset.tab === tab));
  if (tab === 'salons') {
    const card = (label, n, attr, on, sub = '') => `<button class="stat ${on ? 'on' : ''}" ${attr}><small>${esc(label)}</small><b>${n}</b>${sub ? `<em>${sub}</em>` : ''}</button>`;
    const sel = (f, label, list) => `<select data-f="${f}">${opts([['',`Tất cả ${label}`], ...list], filter[f] || '')}</select>`;
    v.innerHTML = `<div class="head"><h2>Khách hàng</h2><button class="main" id="add">+ Thêm khách</button></div>
      <input id="q" placeholder="Tìm tên, SĐT, mã KH, công ty..." value="${esc(q)}">
      <div class="cards">${card('Tổng data', S.length, 'data-stage=""', !filter.stage && !filter.potential && !filter.lead_status, 'được giao')}${card('Closedeal', S.filter(s => s.lead_status === 'Closedeal').length, 'data-lead="Closedeal"', filter.lead_status === 'Closedeal', 'đã chốt')}
        ${[...new Set([...PRODUCTS, ...values('potential')])].map(b => card(b, S.filter(s => s.potential === b).length, `data-brand="${esc(b)}"`, filter.potential === b)).join('')}</div>
      <div class="row">${FIELDS.map(([f,label]) => sel(f, label, f === 'stage' ? Object.entries(STAGE) : f === 'lead_status' ? [['_none','Chưa có Lead Status'], ...LEADS.map(x => [x,x])] : f === 'reason' ? REASONS.map(x => [x,x]) : values(f).map(x => [esc(x),esc(x)]))).join('')}
        ${sel('late', 'hạn gọi', [['1','Chỉ quá hạn']])}${sel('month', 'tháng', [...new Set(S.map(monthOf))].sort().map(x => [x,x]))}</div>
      <div id="list"></div>`;
    list();
    $('#q').oninput = e => { q = e.target.value; list(); };
    $('#add').onclick = () => edit();
    v.querySelectorAll('[data-f]').forEach(x => x.onchange = () => { filter[x.dataset.f] = x.value; render(); });
    v.querySelectorAll('[data-stage]').forEach(x => x.onclick = () => { filter.stage = x.dataset.stage; if (!x.dataset.stage) filter.potential = filter.lead_status = ''; render(); });
    v.querySelectorAll('[data-lead]').forEach(x => x.onclick = () => { filter.lead_status = filter.lead_status === x.dataset.lead ? '' : x.dataset.lead; render(); });
    v.querySelectorAll('[data-brand]').forEach(x => x.onclick = () => { filter.potential = filter.potential === x.dataset.brand ? '' : x.dataset.brand; render(); });
  } else if (tab === 'campaign') {
    v.innerHTML = values('campaign').map(c => { const r = S.filter(s => s.campaign === c); return `<h3>${esc(c)} (${r.length})</h3>${table(r)}`; }).join('')
      || '<p>Chưa có campaign. Mở một khách và điền ô Campaign.</p>';
  } else if (tab === 'potential') {
    v.innerHTML = POT.map(p => { const r = active.filter(s => s.potential === p); return `<h3>${p} (${r.length})</h3>${table(r)}`; }).join('');
  } else if (tab === 'order') {
    v.innerHTML = `<h2>Order</h2><div class="scroll"><table><tr><th>Ngày</th><th>Tiệm</th><th>Số tiền</th><th>Sản phẩm</th><th>Nhân viên</th></tr>${[...O].reverse().map(o => {
      const x = S.find(s => s.id === o.salon_id);
      return `<tr><td>${time(o.created_at)}</td><td><button data-id="${o.salon_id}">${esc(x?.name)}</button></td><td>${money(o.amount)}</td><td>${esc(o.note)}</td><td>${esc(M.find(m => m.user_id === o.user_id)?.name)}</td></tr>`;
    }).join('') || '<tr><td colspan="5">Chưa có đơn</td></tr>'}</table></div>`;
  } else if (tab === 'follow') {
    v.innerHTML = table(active.filter(s => s.follow_up).sort((a,b) => new Date(a.follow_up) - new Date(b.follow_up)));
  } else if (tab === 'pipe') {
    v.innerHTML = Object.entries(STAGE).map(([k,t]) => { const r = active.filter(s => s.stage === k); return `<h3>${t} (${r.length})</h3>${table(r)}`; }).join('');
  } else if (['approve','product','daily','contest','notice','chat'].includes(tab)) {
    v.innerHTML = `<h2>${document.querySelector(`nav [data-tab=${tab}]`).lastChild.textContent}</h2><div class="card">Mục này chưa làm.</div>`;
  } else if (tab === 'help') {
    v.innerHTML = `<h2>Hướng dẫn</h2><div class="card"><p>Thêm khách: vào Khách hàng, bấm "+ Thêm khách".</p><p>Sửa khách, ghi cuộc gọi, thêm đơn: bấm vào tên tiệm.</p><p>Lịch gọi lại: điền ô "Gọi lại", xem ở Cảnh báo.</p><p>Khách yêu cầu ngừng liên hệ: tick "Không gọi".</p></div>`;
  } else if (tab === 'system') {
    v.innerHTML = `<h2>System</h2><div class="scroll"><table><tr><th>Thành viên</th><th>Quyền</th></tr>${M.map(m => `<tr><td>${esc(m.name)}</td><td>${esc(m.role)}</td></tr>`).join('')}</table></div>`;
  } else if (tab === 'dnc') {
    v.innerHTML = table(S.filter(s => s.do_not_call));
  } else {
    const month = new Date().toISOString().slice(0,7);
    v.innerHTML = `<h3>Tháng ${month} (theo giờ UTC)</h3><div class="scroll"><table><tr><th>Nhân viên</th><th>Cuộc gọi</th><th>Đơn</th><th>Doanh số</th></tr>${M.map(m => {
      const mine = x => x.user_id === m.user_id && x.created_at.startsWith(month), o = O.filter(mine);
      return `<tr><td>${esc(m.name)}</td><td>${C.filter(mine).length}</td><td>${o.length}</td><td>${money(o.reduce((a,x) => a + Number(x.amount), 0))}</td></tr>`;
    }).join('')}</table></div>`;
  }
}

const TZ = {N:'America/New_York',C:'America/Chicago',D:'America/Denver',L:'America/Los_Angeles',P:'America/Phoenix',A:'America/Anchorage',H:'Pacific/Honolulu'};
const ST = Object.fromEntries('AL|Alabama|C,AK|Alaska|A,AZ|Arizona|P,AR|Arkansas|C,CA|California|L,CO|Colorado|D,CT|Connecticut|N,DE|Delaware|N,DC|District of Columbia|N,FL|Florida|N,GA|Georgia|N,HI|Hawaii|H,ID|Idaho|D,IL|Illinois|C,IN|Indiana|N,IA|Iowa|C,KS|Kansas|C,KY|Kentucky|N,LA|Louisiana|C,ME|Maine|N,MD|Maryland|N,MA|Massachusetts|N,MI|Michigan|N,MN|Minnesota|C,MS|Mississippi|C,MO|Missouri|C,MT|Montana|D,NE|Nebraska|C,NV|Nevada|L,NH|New Hampshire|N,NJ|New Jersey|N,NM|New Mexico|D,NY|New York|N,NC|North Carolina|N,ND|North Dakota|C,OH|Ohio|N,OK|Oklahoma|C,OR|Oregon|L,PA|Pennsylvania|N,RI|Rhode Island|N,SC|South Carolina|N,SD|South Dakota|C,TN|Tennessee|C,TX|Texas|C,UT|Utah|D,VT|Vermont|N,VA|Virginia|N,WA|Washington|L,WV|West Virginia|N,WI|Wisconsin|C,WY|Wyoming|D'.split(',').map(x => { const [c, n, z] = x.split('|'); return [c, [n, TZ[z]]]; }));
const CALLS = ['Không bắt máy','Đã nói chuyện','Hẹn gọi lại','Quan tâm','Từ chối'];

function edit(s = {}, ids = []) {
  const d = $('#dlg'), who = id => esc(M.find(m => m.user_id === id)?.name);
  const history = [
    ...C.filter(c => c.salon_id === s.id).map(c => [c.created_at, `${who(c.user_id)}: ${esc(c.result)} ${esc(c.note)}`]),
    ...O.filter(o => o.salon_id === s.id).map(o => [o.created_at, `${who(o.user_id)}: đơn ${money(o.amount)} ${esc(o.note)}`])
  ].sort((a,b) => b[0].localeCompare(a[0]));
  const i = ids.indexOf(String(s.id)), go = n => edit(S.find(x => x.id == ids[i + n]), ids);
  const fl = (label, html, cls = '') => `<label class="fl ${cls}"><span>${label}</span>${html}</label>`;
  const inp = (n, label, ph = '') => fl(label, `<input name="${n}" placeholder="${ph}" value="${esc(s[n])}" ${n === 'name' ? 'required' : ''} ${n === 'brand' ? 'list="products"' : ''}>`);
  const tel = (n, label) => fl(label, `<div class="tel"><input name="${n}" ${n === 'phone' ? 'required' : ''} value="${esc(s[n])}" ${s[n] ? 'readonly' : ''}>${s[n] && !s.do_not_call ? `<a class="ic call" href="tel:+1${esc(s[n])}">📞</a>` : ''}<button type="button" class="ic" data-edit>✎</button></div>`);
  const sel = (n, label, list, v, cls) => fl(label, `<select name="${n}">${opts(list, v)}</select>`, cls);
  const zone = s.timezone || ST[(s.state || '').toUpperCase()]?.[1] || 'America/Chicago';
  d.innerHTML = `<header class="dh"><span class="ava big">${initials(s.assigned_to || me.user_id)}</span>
    <div class="dt"><b>${esc(s.owner || s.name || 'Khách mới')}</b><span class="clk" id="clk"></span><small>${esc(s.name)}${s.code ? ' · ' + esc(s.code) : ''}</small></div>
    <button type="button" class="sq" data-close>✕</button></header>
  <div class="db"><form id="f" class="g">
    ${inp('name','Business name')}${inp('address','Address')}
    ${inp('city','City','Thành phố')}${sel('state','State',[['','Chọn bang'], ...Object.entries(ST).map(([c,[n]]) => [c,n])], (s.state || '').toUpperCase())}
    ${inp('zip','Zipcode')}<span></span>
    ${tel('phone','Business phone')}${inp('owner','Customer name')}
    ${tel('cellphone','Cellphone')}${inp('owner2','Customer name 2')}
    ${tel('cellphone2','Cellphone 2')}<span></span>
    ${fl('Description', `<textarea name="description" rows="5">${esc(s.description)}</textarea>`, 'full')}
    ${s.id && !s.do_not_call ? sel('result','Kết quả cuộc gọi',[['','-- Chọn --'], ...CALLS.map(x => [x,x])],'','full') + fl('Ghi chú', '<textarea name="note" rows="3" placeholder="Nội dung cuộc gọi..."></textarea>', 'full') : ''}
    ${sel('stage','Status',Object.entries(STAGE), s.stage || 'new')}${sel('potential','Potential',[['','—'], ...POT.map(x => [x,x])], s.potential || '')}
    ${sel('lead_status','Lead status',[['','Chưa có Lead Status'], ...LEADS.map(x => [x,x])], s.lead_status || '')}${inp('lead_source','Lead (nguồn)')}
    ${inp('campaign','Campaign')}
    ${sel('reason','Reason (lý do)',[['','—'], ...REASONS.map(x => [x,x])], s.reason || '')}
    ${sel('assigned_to','Giao cho',M.map(m => [m.user_id, esc(m.name)]), s.assigned_to || me.user_id)}${fl('Gọi lại (giờ máy bạn)','<input name="follow_up" type="datetime-local">')}
    <label class="full" style="margin-top:14px"><input type="checkbox" name="do_not_call" ${s.do_not_call ? 'checked' : ''}> Không gọi</label>
    <input type="hidden" name="timezone" value="${zone}">
    <datalist id="products">${PRODUCTS.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
  </form>
  <form id="order" class="g" hidden>${fl('Số tiền $','<input name="amount" type="number" step="0.01" min="0.01" required>')}${fl('Sản phẩm','<input name="note">')}<button class="main full" style="margin-top:12px">Thêm đơn</button></form>
  ${s.id ? `<h4>Lịch sử</h4><ul>${history.map(h => `<li>${time(h[0])} - ${h[1]}</li>`).join('')}</ul>` : ''}</div>
  <footer class="df">${i >= 0 && ids.length > 1 ? `<button type="button" id="prev" ${i < 1 ? 'disabled' : ''}>◀</button><span>${i + 1}/${ids.length}</span><button type="button" id="next" ${i >= ids.length - 1 ? 'disabled' : ''}>▶</button>` : ''}
    <button type="button" data-close>Đóng</button>${s.id ? '<button type="button" id="help">🎧 Nhờ hỗ trợ</button><button type="button" id="inv">🧾 Tạo Invoice</button>' : ''}<button class="main" form="f">💾 Lưu</button></footer>`;

  const f = d.querySelector('#f'), input = f.follow_up;
  if (s.follow_up) { const t = new Date(s.follow_up); input.value = new Date(t - t.getTimezoneOffset()*60000).toISOString().slice(0,16); }
  const tick = () => { const st = ST[f.state.value]; d.querySelector('#clk').textContent = `🕒 ${new Date().toLocaleTimeString('en-US', {timeZone: f.timezone.value, hour: '2-digit', minute: '2-digit'})}${st ? ` (${st[0]})` : ''}`; };
  f.state.onchange = () => { const z = ST[f.state.value]?.[1]; if (z) f.timezone.value = z; tick(); };
  tick(); clearInterval(d.t); d.t = setInterval(tick, 30000); d.onclose = () => clearInterval(d.t);
  d.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const x = b.parentNode.querySelector('input'); x.readOnly = false; x.focus(); });
  d.querySelectorAll('[data-close]').forEach(b => b.onclick = () => d.close());
  if (i >= 0) { d.querySelector('#prev') && (d.querySelector('#prev').onclick = () => go(-1)); d.querySelector('#next') && (d.querySelector('#next').onclick = () => go(1)); }
  if (s.id) {
    d.querySelector('#inv').onclick = () => { const o = d.querySelector('#order'); o.hidden = false; o.scrollIntoView({behavior:'smooth'}); o.amount.focus(); };
    d.querySelector('#help').onclick = async () => {
      const n = prompt('Bạn cần hỗ trợ gì?'); if (!n) return;
      await run(db.from('calls').insert({salon_id: s.id, result: 'Nhờ hỗ trợ', note: n})); d.close(); await load();
    };
  }
  const on = (id, fn) => { const form = d.querySelector(id); if (form) form.onsubmit = async e => {
    e.preventDefault();
    const btn = e.submitter; btn.disabled = true;
    try { await fn(Object.fromEntries(new FormData(form))); d.close(); await load(); }
    finally { btn.disabled = false; }
  }; };
  on('#f', async ({result, note, ...v}) => {
    for (const k of ['potential','lead_status','lead_source','reason','campaign','address','city','zip','owner2','cellphone','cellphone2','description']) v[k] = v[k]?.trim() || null;
    for (const k of ['phone','cellphone','cellphone2']) if (v[k]) v[k] = phone(v[k]);
    const row = {...v, do_not_call: !!v.do_not_call, follow_up: v.follow_up ? new Date(v.follow_up).toISOString() : null};
    if (result && row.stage === 'new') row.stage = 'called';
    await run(s.id ? db.from('salons').update(row).eq('id', s.id) : db.from('salons').insert(row));
    if (result) await run(db.from('calls').insert({result, note, salon_id: s.id}));
  });
  on('#order', async v => {
    await run(db.from('orders').insert({...v, salon_id: s.id}));
    await run(db.from('salons').update({stage:'ordered', lead_status:'Closedeal'}).eq('id', s.id));
  });
  if (!d.open) d.showModal();
}

$('#login').onsubmit = async e => {
  e.preventDefault();
  const {error} = await db.auth.signInWithPassword(Object.fromEntries(new FormData(e.target)));
  if (error) return alert(error.message);
  start();
};
$('#out').onclick = $('#switch').onclick = async () => { await db.auth.signOut({scope:'local'}); location.reload(); };
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'apps') $('#menu').showModal();
  if (b.dataset.tab) { $('#menu').close(); tab = b.dataset.tab; load(); }
  if (b.dataset.id) edit(S.find(s => s.id == b.dataset.id), [...new Set([...(b.closest('table')?.querySelectorAll('[data-id]') || [])].map(x => x.dataset.id))]);
});
start();
</script>
</body>
</html>
